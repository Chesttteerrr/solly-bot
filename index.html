<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solly | Discord Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #d1d5db; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; overflow: hidden; background-image: radial-gradient(circle at center, #1e293b 0%, #0b0f19 70%); }
        
        /* Müzik Kontrol Alanı */
        .music-wrapper {
            position: fixed; top: 25px; left: 25px; z-index: 9999;
            display: flex; align-items: center; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px; padding: 5px; height: 50px;
        }

        #music-control {
            cursor: pointer; width: 40px; height: 40px; display: flex; 
            align-items: center; justify-content: center; font-size: 20px;
            background: #3b82f6; border: none; border-radius: 50%; color: white;
            transition: transform 0.2s; outline: none;
        }
        #music-control:hover { transform: scale(1.05); }

        .volume-container {
            width: 0; overflow: hidden; white-space: nowrap;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center;
        }
        .music-wrapper:hover .volume-container { width: 120px; padding-right: 15px; }

        .volume-slider {
            width: 100px; margin-left: 10px; cursor: pointer;
            accent-color: #3b82f6;
        }

        .lang-switch { position: absolute; top: 25px; right: 25px; background: #1f2937; border: 1px solid #374151; color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; transition: background 0.2s; z-index: 10; }
        .lang-switch:hover { background: #374151; }

        .container { max-width: 650px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .bot-avatar { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; margin-bottom: 25px; box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); border: 4px solid #3b82f6; }
        .bot-avatar img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 3rem; color: #ffffff; margin-bottom: 10px; }
        h1 span { color: #3b82f6; }
        p { font-size: 1.1rem; color: #9ca3af; margin-bottom: 20px; line-height: 1.6; }
        
        /* Komut Stilleri ve Başlığı */
        .commands-section {
            width: 100%; text-align: left; margin-bottom: 25px;
        }
        .commands-title {
            font-size: 1rem; color: #9ca3af; margin-bottom: 8px; font-weight: 600;
        }
        .commands-box {
            display: flex; gap: 10px; flex-wrap: wrap;
        }
        .cmd-tag {
            background-color: #1f2937; border: 1px solid #374151; color: #f3f4f6;
            padding: 6px 14px; border-radius: 8px; font-family: monospace; font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-group { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .btn { background-color: #3b82f6; color: white; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); }
        .btn:hover { background-color: #2563eb; transform: translateY(-2px); }
        .btn-secondary { background-color: #1f2937; border: 1px solid #374151; box-shadow: none; }
        .btn-secondary:hover { background-color: #374151; }
    </style>
</head>
<body>

    <!-- Kesin Çalışan Garantili Lofi Chill Kaynağı -->
    <audio id="chill-audio" loop preload="auto">
        <source src="https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg" type="audio/ogg">
        <source src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" type="audio/ogg">
    </audio>

    <div class="music-wrapper">
        <button id="music-control" onclick="toggleMusic()">🔇</button>
        <div class="volume-container">
            <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-slider" id="volume-slider" oninput="changeVolume(this.value)">
        </div>
    </div>

    <button class="lang-switch" onclick="toggleLanguage()">EN / TR</button>

    <div class="container">
        <div class="bot-avatar"><img src="avatar.jpg" alt="Solly PFP"></div>
        <h1 id="title">Solly <span>Bot</span></h1>
        <p id="desc">Discord sunucundaki kanalları çok daha hızlı ve pratik bir şekilde kurmanı sağlayan efsane bot!</p>
        
        <!-- Komutlar Başlığı ve Etiketler -->
        <div class="commands-section">
            <div class="commands-title" id="cmd-heading">Komutlar</div>
            <div class="commands-box">
                <span class="cmd-tag">/kur</span>
                <span class="cmd-tag">/create</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="https://discord.com/oauth2/authorize?client_id=1538529494347022368&permissions=8&integration_type=0&scope=bot" class="btn" id="btn-add" target="_blank">Sunucuya Ekle</a>
            <a href="https://discord.gg/xJqv2XzSwP" class="btn btn-secondary" id="btn-support" target="_blank">Destek Sunucusu</a>
        </div>
    </div>

    <script>
        const audio = document.getElementById('chill-audio');
        const controlBtn = document.getElementById('music-control');
        const volumeSlider = document.getElementById('volume-slider');
        audio.volume = 0.5;

        function toggleMusic() {
            if (audio.paused) {
                audio.play().then(() => {
                    controlBtn.innerText = "🔊";
                }).catch(err => {
                    console.log("Oynatma hatası:", err);
                });
            } else {
                audio.pause();
                controlBtn.innerText = "🔇";
            }
        }

        function changeVolume(val) {
            audio.volume = val;
            if (val == 0) {
                controlBtn.innerText = "🔇";
            } else if (audio.paused === false) {
                controlBtn.innerText = "🔊";
            }
        }

        let currentLang = 'tr';
        function toggleLanguage() {
            const desc = document.getElementById('desc');
            const cmdHeading = document.getElementById('cmd-heading');
            const btnAdd = document.getElementById('btn-add');
            const btnSupport = document.getElementById('btn-support');
            const langBtn = document.querySelector('.lang-switch');

            if (currentLang === 'tr') {
                currentLang = 'en';
                langBtn.innerText = 'TR / EN';
                desc.innerText = 'An awesome bot that allows you to set up channels in your Discord server much faster and more practically!';
                cmdHeading.innerText = 'Commands';
                btnAdd.innerText = 'Add to Server';
                btnSupport.innerText = 'Support Server';
            } else {
                currentLang = 'tr';
                langBtn.innerText = 'EN / TR';
                desc.innerText = 'Discord sunucundaki kanalları çok daha hızlı ve pratik bir şekilde kurmanı sağlayan efsane bot!';
                cmdHeading.innerText = 'Komutlar';
                btnAdd.innerText = 'Sunucuya Ekle';
                btnSupport.innerText = 'Destek Sunucusu';
            }
        }
    </script>
</body>
</html>
